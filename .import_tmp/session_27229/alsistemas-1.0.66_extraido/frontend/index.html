<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portal de notícias" />
    <meta name="robots" content="index, follow" />
    <meta name="google" content="notranslate" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portal de notícias" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" /></noscript>
    <style>
      #boot-screen{min-height:100vh;background:#f7faf8;color:#17231c;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 18px}
      .boot-shell{max-width:1120px;margin:0 auto;padding:28px 0}.boot-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0 24px}.boot-brand{font-weight:850;font-size:18px;letter-spacing:-.02em}.boot-live{display:flex;align-items:center;gap:7px;font-size:12px;color:#607066}.boot-live:before{content:"";width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 5px rgba(22,163,74,.10)}
      .boot-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr);gap:18px}.boot-card{background:#fff;border:1px solid #e4ebe6;border-radius:20px;overflow:hidden}.boot-image{height:290px}.boot-copy{padding:20px}.boot-line,.boot-image{background:linear-gradient(100deg,#eef3ef 25%,#f8faf9 45%,#eef3ef 65%);background-size:220% 100%;animation:boot-shimmer 1.4s ease-in-out infinite}.boot-line{height:14px;border-radius:8px;margin-top:10px}.boot-line.lg{height:30px;width:88%}.boot-line.md{width:72%}.boot-line.sm{width:45%}.boot-side{display:grid;gap:12px}.boot-mini{padding:16px}.boot-mini .boot-line:first-child{margin-top:0}.boot-note{text-align:center;color:#68776e;font-size:12px;padding:24px 0}
      @keyframes boot-shimmer{to{background-position:-220% 0}}@media(max-width:720px){.boot-grid{grid-template-columns:1fr}.boot-image{height:220px}.boot-side{grid-template-columns:1fr 1fr}.boot-mini:last-child{display:none}}
    </style>
    <title>Portal de notícias</title>
  </head>
  <body>
    <div id="als-native-guard" style="position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#f8faf9;color:#18221d;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:20px">
      <div style="max-width:560px;width:100%;background:#fff;border:1px solid #e4ebe6;border-radius:16px;padding:20px;box-shadow:0 14px 38px rgba(27,94,59,.10)">
        <strong style="display:block;font-size:16px">Portal de notícias</strong>
        <span id="als-native-guard-message" style="display:block;margin-top:5px;color:#66756c;font-size:13px;line-height:1.5">Inicializando interface…</span>
      </div>
    </div>
    <script>
      (function(){
        function showFatal(message){
          var guard=document.getElementById('als-native-guard');
          var text=document.getElementById('als-native-guard-message');
          if(guard) guard.style.display='grid';
          if(text) text.textContent='Falha ao iniciar a interface: '+String(message||'erro desconhecido')+'. Recarregue a página. Se continuar, abra Administração → Erros.';
        }
        window.__AL_NATIVE_GUARD_HIDE__=function(){ var g=document.getElementById('als-native-guard'); if(g) g.remove(); };
        window.addEventListener('error',function(e){ if(!document.getElementById('root')?.hasChildNodes()) showFatal(e.error?.message||e.message); });
        window.addEventListener('unhandledrejection',function(e){ if(!document.getElementById('root')?.hasChildNodes()) showFatal(e.reason?.message||e.reason); });
        // Em execução local/Termux, SW antigo é uma causa comum de tela branca após troca de versão.
        if((location.hostname==='127.0.0.1'||location.hostname==='localhost')&&'serviceWorker' in navigator){
          navigator.serviceWorker.getRegistrations().then(function(regs){ regs.forEach(function(r){ r.unregister(); }); }).catch(function(){});
          if('caches' in window) caches.keys().then(function(keys){ keys.filter(function(k){return k.indexOf('alsistemas-')===0;}).forEach(function(k){caches.delete(k);}); }).catch(function(){});
        }
      })();
    </script>
    <div id="root"><div id="boot-screen"><div class="boot-shell"><div class="boot-head"><div id="boot-portal-name" class="boot-brand">Portal de notícias</div><div class="boot-live">Atualizando a sua leitura</div></div><div class="boot-grid"><div class="boot-card"><div class="boot-image"></div><div class="boot-copy"><div class="boot-line lg"></div><div class="boot-line md"></div><div class="boot-line sm"></div></div></div><div class="boot-side"><div class="boot-card boot-mini"><div class="boot-line md"></div><div class="boot-line"></div><div class="boot-line sm"></div></div><div class="boot-card boot-mini"><div class="boot-line md"></div><div class="boot-line"></div><div class="boot-line sm"></div></div><div class="boot-card boot-mini"><div class="boot-line md"></div><div class="boot-line"></div><div class="boot-line sm"></div></div></div></div><div class="boot-note">Buscando as notícias mais recentes…</div></div></div></div>
    <script>
      // Mostra a identidade pública já no primeiro carregamento, antes do React iniciar.
      // Falhas de API não impedem o boot: uma identidade pública neutra permanece como fallback.
      // Primeiro uso: o status é lido apenas do cofre local do backend, sem MongoDB.
      // Isso permite redirecionar uma instalação nova mesmo quando a pessoa abre '/'.
      window.__AL_SETUP_STATUS_PROMISE__ = fetch('/api/setup/status', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : null })
        .then(function (status) {
          if (status && status.setup_needed && location.pathname !== '/admin/setup') {
            location.replace('/admin/setup')
          }
          return status
        })
        .catch(function () { return null })

      window.__AL_PUBLIC_CONFIG_PROMISE__ = window.__AL_SETUP_STATUS_PROMISE__.then(function (status) {
        if (status && status.setup_needed) return null
        return fetch('/api/configuracoes', { credentials: 'same-origin' })
      })
        .then(function (r) { return r && r.ok ? r.json() : null })
        .then(function (cfg) {
          if (!cfg) return null
          window.__AL_PUBLIC_CONFIG__ = cfg
          var nome = String(cfg.nome_site || '').trim()
          if (nome) {
            var el = document.getElementById('boot-portal-name')
            if (el) el.textContent = nome
            document.title = cfg.site_titulo || nome
          }
          return cfg
        })
        .catch(function () { return null })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
